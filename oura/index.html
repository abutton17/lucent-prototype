<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lucent · Steady Glucose prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: chapter list | phone on a dark stage | caption and talk track. Single dark look to match the ring app. */
:root {
  --bg: #0A0C10;
  --panel: #12151B;
  --line: #232833;
  --fg: #EEF0F3;
  --muted: #9AA2AF;
  --gold: #C3C8D2;
  --gold-ink: #0B1622;
  --gold-soft: #1C2129;
  --sans: 'DM Sans', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'DM Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.app { min-height: 100%; display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; gap: 16px; box-sizing: border-box; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 14px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.kbd { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.kbd kbd { font-family: var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--fg); background: var(--panel); }
.toggle { min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 13px; cursor: pointer; }
.toggle[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }

.main { flex: 1; display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.app.focus .main { grid-template-columns: minmax(0, 1fr) 340px; }
.app.focus .nav { display: none; }

.nav { display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); }
.nav h2 { margin: 0 0 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.nav ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
.nav button:hover { color: var(--fg); background: var(--panel); }
.nav button[aria-current="step"] { color: var(--fg); background: var(--panel); border-color: var(--line); }
.nav .n { font-family: var(--mono); font-size: 12px; width: 18px; color: var(--gold); }

.stage { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
.phone-box { width: calc(414px * var(--s, 1)); height: calc(868px * var(--s, 1)); }
.phone { width: 414px; height: 868px; transform: scale(var(--s, 1)); transform-origin: top left; box-sizing: border-box; padding: 12px; border-radius: 56px; background: #05070A; border: 1px solid #2A2F3A; box-shadow: 0 30px 80px rgba(0,0,0,0.55); }
.viewport { width: 390px; height: 844px; border-radius: 44px; overflow-y: auto; overflow-x: hidden; background: #0F1218; scrollbar-width: none; position: relative; }
.viewport::-webkit-scrollbar { display: none; }
.viewport a { color: #E6E8EC; text-decoration: none; }
.viewport a:hover { color: #FFFFFF; }
.viewport > div > div { font-family: 'DM Sans', system-ui, sans-serif; }

.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; }
.step-btn { min-height: 40px; min-width: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 14px; cursor: pointer; }
.step-btn:disabled { opacity: 0.4; cursor: default; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
.demo { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.seg button { min-height: 34px; padding: 0 12px; border: none; background: var(--panel); color: var(--muted); font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); }
.ghost { min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px dashed var(--line); background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; }
.ghost:hover { color: var(--fg); }

.side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: env(safe-area-inset-top, 0px); min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--gold); letter-spacing: 0.04em; }
.card h1 { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; line-height: 1.55; color: #C9CED6; }
.try { display: flex; gap: 8px; align-items: baseline; font-size: 14px; color: var(--fg); background: var(--gold-soft); border-radius: 10px; padding: 10px 12px; }
.try b { color: var(--gold); font-weight: 600; white-space: nowrap; }
.talk { border-color: #2E3440; }
.talk p { font-size: 16px; color: var(--fg); }
.disclaimer { font-size: 12px; color: var(--muted); line-height: 1.5; }

@media (max-width: 1180px) {
  .main, .app.focus .main { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; flex-direction: row; overflow-x: auto; gap: 16px; }
  .nav section { min-width: max-content; }
  .nav ol { flex-direction: row; }
  .nav button { width: auto; white-space: nowrap; }
  .side { position: static; max-width: 560px; margin-inline: auto; width: 100%; }
}
@media (max-width: 600px) {
  .tools { display: none; }
  .brand span { font-size: 13px; }
  .nav { gap: 12px; padding-bottom: 4px; }
  .phone { padding: 8px; border-radius: 48px; }
}
@media (prefers-reduced-motion: no-preference) {
  .viewport > div { animation: in 180ms ease-out; }
  @keyframes in { from { opacity: 0.4; } to { opacity: 1; } }
}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Stress Roots</b><span>Prototype v3 for Oura · the prediabetes experiment, member view · concept mockup, not affiliated with Oura</span></div>
    <div class="tools">
      <span class="kbd"><kbd>←</kbd> <kbd>→</kbd> step · <kbd>F</kbd> focus</span>
      <button class="toggle" id="focusBtn" aria-pressed="false">Focus mode</button>
    </div>
  </header>

  <div class="main">
    <nav class="nav" id="nav" aria-label="Screens"></nav>

    <div class="stage">
      <div class="phone-box"><div class="phone"><div class="viewport" id="viewport" aria-live="polite"><div id="root"></div></div></div></div>
      <div class="controls">
        <button class="step-btn" id="prev" aria-label="Previous screen">←</button>
        <span class="count" id="count">1 / 12</span>
        <button class="step-btn" id="next" aria-label="Next screen">→</button>
      </div>
      <div class="demo" id="demo"></div>
    </div>

    <aside class="side">
      <div class="card">
        <span class="eyebrow" id="eyebrow"></span>
        <h1 id="label"></h1>
        <p id="caption"></p>
        <div class="try"><b>Try</b><span id="tryit"></span></div>
      </div>
      <p class="disclaimer">All data on these screens is illustrative. Stress Roots offers wellness context, not a diagnosis.</p>
    </aside>
  </div>
</div>

<template id="tpl-Goal">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #F2F3F5; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 16px 24px; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <a href="#" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #181C24; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="font-size: 13px; color: #A8B0BE; letter-spacing: 0.06em">STEADY GLUCOSE</span>
    <span style="width: 44px"></span>
  </div>
  <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 400; line-height: 1.2">Treating toxic stress can help you manage prediabetes</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C3C8D2">Toxic stress can make blood sugar harder to manage. Knowing your stress history can help you find the path most likely to work for you.</p>
  </div>
  <ol style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column">
    <li style="display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #222731"><span style="width: 26px; height: 26px; border-radius: 13px; background: #2A2F3A; display: flex; align-items: center; justify-content: center; font-size: 12px">1</span><span style="flex: 1; font-size: 16px">Your stress history</span><span style="font-size: 13px; color: #8D96A6">2 min</span></li>
    <li style="display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #222731"><span style="width: 26px; height: 26px; border-radius: 13px; background: #2A2F3A; display: flex; align-items: center; justify-content: center; font-size: 12px">2</span><span style="flex: 1; font-size: 16px">Stress-related conditions</span><span style="font-size: 13px; color: #8D96A6">1 min</span></li>
    <li style="display: flex; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid #222731"><span style="width: 26px; height: 26px; border-radius: 13px; background: #2A2F3A; display: flex; align-items: center; justify-content: center; font-size: 12px">3</span><span style="flex: 1; font-size: 16px">Your stress buffers</span><span style="font-size: 13px; color: #8D96A6">3 min</span></li>
  </ol>
  <div style="flex: 1"></div>
  <label style="display: flex; gap: 12px; align-items: center; font-size: 14px; line-height: 1.45; color: #D5D9E0; cursor: pointer">
    <input type="checkbox" checked="{{agreed}}" onChange="{{toggle}}" style="width: 22px; height: 22px; margin: 0; accent-color: #E6E8EC; flex: 0 0 auto">
    <span>Questions are private, and you can skip any.</span>
  </label>
  <sc-if value="{{agreed}}" hint-placeholder-val="{{ true }}"><a href="Roots.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 26px; background: #86BDF0; color: #0B1622; font-size: 16px; font-weight: 500; border: none; font-family: inherit; cursor: pointer">Get started</a></sc-if>
  <sc-if value="{{notAgreed}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 26px; background: #86BDF0; color: #0B1622; font-size: 16px; font-weight: 500; border: none; font-family: inherit; cursor: pointer; background: #2A2F3A; color: #8D96A6">Get started</span></sc-if>
</div>
</template>
<template id="tpl-Roots">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1218; color: #F2F3F5; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 16px 24px; gap: 14px">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <a href="Goal.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #181C24; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 13px; color: #A8B0BE">Step 1 of 3 · Stress history</span>
    <span style="width: 44px"></span>
  </div>

  <h1 style="margin: 8px 0 0; padding: 0 4px; font-size: 26px; font-weight: 400; line-height: 1.2; white-space: nowrap">Childhood stress can linger</h1>
  <div style="display: flex; flex-direction: column; gap: 22px; padding: 12px 4px 0">
    <div style="display: flex; gap: 14px; align-items: flex-start">
      <span aria-hidden="true" style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; background: #232833; color: #C3C8D2; display: flex; align-items: center; justify-content: center; font-size: 18px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #C3C8D2; display: block"></span></span>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 1.3">It keeps the body on alert</span><span style="font-size: 14px; line-height: 1.45; color: #A8B0BE">Abuse, neglect, or violence or addiction at home can keep the stress system switched on.</span></div>
    </div>
    <div style="display: flex; gap: 14px; align-items: flex-start">
      <span aria-hidden="true" style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; background: #232833; color: #C3C8D2; display: flex; align-items: center; justify-content: center; font-size: 18px">↑</span>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 1.3">It raises health risks</span><span style="font-size: 14px; line-height: 1.45; color: #A8B0BE">Like diabetes, heart disease and depression. With 4+ childhood stressors, the odds of diabetes are 44% higher.<br><span style="font-size: 11.5px; color: #6F7787">Source: Zhu et al., 2022</span></span></div>
    </div>
    <div style="display: flex; gap: 14px; align-items: flex-start">
      <span aria-hidden="true" style="width: 36px; height: 36px; flex: 0 0 36px; border-radius: 18px; background: #232833; color: #C3C8D2; display: flex; align-items: center; justify-content: center; font-size: 18px">↓</span>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 17px; line-height: 1.3">It can be treated</span><span style="font-size: 14px; line-height: 1.45; color: #A8B0BE">The right habits calm the stress response over time.</span></div>
    </div>
  </div>
  <div style="margin-top: 10px; background: #181C24; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; letter-spacing: 0.08em; font-weight: 600; color: #E6E8EC">NEXT</span>
    <span style="font-size: 15px; line-height: 1.4">10 yes/no questions about childhood</span>
    <span style="font-size: 13px; line-height: 1.4; color: #A8B0BE">Many people answer yes to one or more. Skip any.</span>
  </div>
  <div style="flex: 1"></div>
  <a href="History.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 26px; background: #86BDF0; color: #0B1622; font-size: 16px; font-weight: 500; border: none; font-family: inherit; cursor: pointer">Continue</a>
  <a href="Health.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; font-size: 14px; color: #A8B0BE">Skip this step for now</a>
  <span style="font-size: 12px; color: #8D96A6; text-align: center">Feeling stirred up? Call or text <a href="tel:988">988</a> anytime.</span>
</div>
</template>
<template id="tpl-History">

<div style="width: 390px; height: 1390px; box-sizing: border-box; background: #0F1218; color: #F2F3F5; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 16px 28px; gap: 22px">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <a href="Roots.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #181C24; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 13px; color: #A8B0BE">Step 1 of 3 · Stress history</span>
    <span style="width: 44px"></span>
  </div>
  <div style="padding: 4px 4px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 400; line-height: 1.25">Before you turned 18, did you…</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #A8B0BE">Tap Yes or No. Leave any blank to skip.</p>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <section aria-label="{{g.title}}" style="display: flex; flex-direction: column">
      <span style="padding: 8px 4px 4px; font-size: 12px; letter-spacing: 0.08em; color: #8D96A6">{{g.title}}</span>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
        <div style="{{r.wrap}}"><span style="flex: 1; font-size: 14.5px; line-height: 1.35">{{r.text}}</span><div role="radiogroup" aria-label="{{r.text}}" style="display: grid; grid-template-columns: 56px 56px; gap: 6px"><sc-for list="{{r.opts}}" as="o" hint-placeholder-count="2"><button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
      </sc-for>
    </section>
  </sc-for>
  <section aria-label="Your privacy" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 20px; background: #1C2129; border: 1px solid #2E3440">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #2A2F3A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C3C8D2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 500">Your answers stay private</span><span style="font-size: 12.5px; color: #A8B0BE">Used only to tailor your plan.</span></span>
    </div>
    <button role="switch" aria-checked="{{countOnly}}" onClick="{{toggle}}" style="all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 14px; border-top: 1px solid #2E3440; font-family: inherit">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Save only my count</span><span style="font-size: 12.5px; color: #A8B0BE">{{countSub}}</span></span>
      <span style="{{track}}"><span style="{{knob}}"></span></span>
    </button>
  </section>
  <a href="Health.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 26px; background: #86BDF0; color: #0B1622; font-size: 16px; font-weight: 500">Continue</a>
  <span style="font-size: 12px; color: #8D96A6; text-align: center">Feeling stirred up? Take a break, or call or text <a href="tel:988">988</a>.</span>
</div>
</template>
<template id="tpl-Health">

<div style="width: 390px; height: 1556px; box-sizing: border-box; background: #0F1218; color: #F2F3F5; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 16px 24px; gap: 26px">
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
    <a href="History.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #181C24; color: #F2F3F5; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span style="font-size: 13px; color: #A8B0BE">Step 2 of 3 · Stress-related conditions</span>
    <span style="width: 44px"></span>
  </div>
  <div style="padding: 4px 4px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 400; line-height: 1.25">Have you been diagnosed with any of these, now or in the past?</h1>
    <p style="margin: 0; font-size: 14.5px; line-height: 1.45; color: #A8B0BE">Conditions associated with early stress. Tap any that apply. Private, and optional.</p>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 4px">
      <span style="font-size: 12px; letter-spacing: 0.06em; color: #8D96A6">{{g.name}}</span>
      <div style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{g.items}}" as="c" hint-placeholder-count="4"><button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.name}}</button></sc-for></div>
    </div>
  </sc-for>

  function draw() {
    const top = viewport.scrollTop;
    const tpl = document.getElementById('tpl-' + STEPS[cur].file);
    const frag = document.createDocumentFragment();
    render(tpl.content, inst.renderVals(), frag);
    root.replaceChildren(frag);
    viewport.scrollTop = top;
  }

  function mount(i) {
    cur = Math.max(0, Math.min(STEPS.length - 1, i));
    const st = STEPS[cur];
    const C = SCREENS[st.file];
    inst = new C(st.file === 'Profile' ? { tier } : st.file === 'Checkin' ? { outcome } : {});
    inst.__draw = draw;
    viewport.scrollTop = 0;
    draw();
    chrome();
    if (location.hash.slice(1) !== st.id) history.replaceState(null, '', '#' + st.id);
  }
  function goFile(file) { const i = STEPS.findIndex((s) => s.file === file); if (i >= 0) mount(i); }

  function vis(i) { let j = i; while (j > 0 && STEPS[j].hidden) j--; return j; }
  function vnum(i) { const j = vis(i); return STEPS.slice(0, j + 1).filter((s) => !s.hidden).length; }
  const VTOTAL = STEPS.filter((s) => !s.hidden).length;
  function chrome() {
    const st = STEPS[cur];
    $('eyebrow').textContent = st.group.toUpperCase() + ' · ' + vnum(cur) + ' OF ' + VTOTAL;
    $('label').textContent = st.label;
    $('caption').textContent = st.caption;
    $('tryit').textContent = st.tryit;
    $('count').textContent = vnum(cur) + ' / ' + VTOTAL;
    $('prev').disabled = cur === 0;
    $('next').disabled = cur === STEPS.length - 1;
    document.querySelectorAll('.nav button').forEach((b) => {
      if (+b.dataset.i === vis(cur)) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    const demo = $('demo'); demo.replaceChildren();
    if (st.file === 'Profile') {
      const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Stress roots scenario');
      [['lower', 'Lower'], ['moderate', 'Moderate'], ['higher', 'Higher']].forEach(([v, l]) => {
        const b = document.createElement('button'); b.textContent = l; b.setAttribute('aria-pressed', String(tier === v));
        b.onclick = () => { tier = v; mount(cur); }; seg.appendChild(b);
      });
      const lab = document.createElement('span'); lab.className = 'kbd'; lab.textContent = 'Stress roots scenario';
      demo.append(lab, seg);
    }
    if (st.file === 'Checkin') {
      const seg = document.createElement('div'); seg.className = 'seg'; seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Experiment outcome');
      [['stuck', 'It stuck'], ['not', 'It didn’t']].forEach(([v, l]) => {
        const b = document.createElement('button'); b.textContent = l; b.setAttribute('aria-pressed', String(outcome === v));
        b.onclick = () => { outcome = v; mount(cur); }; seg.appendChild(b);
      });
      const lab = document.createElement('span'); lab.className = 'kbd'; lab.textContent = 'Outcome';
      demo.append(lab, seg);
    }
    if (st.file === 'Ace') demo.appendChild(ghost('Jump to the end', () => inst.setState({ idx: 10 })));
    demo.appendChild(ghost('Reset this screen', () => mount(cur)));
  }
  function ghost(text, fn) { const b = document.createElement('button'); b.className = 'ghost'; b.textContent = text; b.onclick = fn; return b; }

  function buildNav() {
    const nav = $('nav'); const groups = {};
    let k = 0;
    STEPS.forEach((s, i) => {
      if (s.hidden) return;
      k++;
      if (!groups[s.group]) {
        const sec = document.createElement('section');
        const h = document.createElement('h2'); h.textContent = s.group;
        const ol = document.createElement('ol'); sec.append(h, ol); nav.appendChild(sec); groups[s.group] = ol;
      }
      const li = document.createElement('li'); const b = document.createElement('button'); b.dataset.i = i;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = String(k);
      const t = document.createElement('span'); t.textContent = s.label;
      b.append(n, t); b.onclick = () => mount(i); li.appendChild(b); groups[s.group].appendChild(li);
    });
  }

  function fit() {
    const narrow = window.innerWidth < 1180;
    const availH = window.innerHeight - (narrow ? 140 : 230);
    const availW = (narrow ? window.innerWidth - 32 : window.innerWidth - 240 - 340 - 80) ;
    const phone = window.innerWidth <= 600;
    const s = phone ? Math.min(1, (window.innerWidth - 32) / 414) : Math.max(0.5, Math.min(1, availH / 868, availW / 414));
    document.documentElement.style.setProperty('--s', s.toFixed(3));
  }

  function setToggle(btn, on, cls) { btn.setAttribute('aria-pressed', String(on)); if (cls) app.classList.toggle(cls, on); }
  $('focusBtn').onclick = () => { const on = !app.classList.contains('focus'); setToggle($('focusBtn'), on, 'focus'); fit(); };
  $('prev').onclick = () => mount(cur - 1);
  $('next').onclick = () => mount(cur + 1);
  document.addEventListener('keydown', (e) => {
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { mount(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { mount(cur - 1); e.preventDefault(); }
    else if (e.key === 'f' || e.key === 'F') $('focusBtn').click();
  });
  window.addEventListener('hashchange', () => { const i = STEPS.findIndex((s) => s.id === location.hash.slice(1)); if (i >= 0 && i !== cur) mount(i); });
  window.addEventListener('resize', fit);

  buildNav(); fit();
  const start = STEPS.findIndex((s) => s.id === location.hash.slice(1));
  mount(start >= 0 ? start : 0);
})();
</script>

</body>
</html>
